name: TruthLens CI

on:
  pull_request:
    branches:
      - feature/searxng-permanent-evidence-store
      - rag
  push:
    branches:
      - fix/truthlens-p0-p1-audit

permissions:
  contents: read

jobs:
  python-tests:
    name: Python test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  docker-build:
    name: Build deployment image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag truthlens-ci .
